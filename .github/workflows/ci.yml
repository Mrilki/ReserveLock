name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest

    env:
      TEST_POSTGRES_DSN: postgres://reservelock:reservelock-local@localhost:5432/reservelock_reservation?sslmode=disable

    services:
      postgres:
        image: postgres:17

        env:
          POSTGRES_USER: reservelock
          POSTGRES_PASSWORD: reservelock-local
          POSTGRES_DB: reservelock_reservation

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U reservelock -d reservelock_reservation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Set up Buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Install protobuf Go plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Download dependencies
        run: go mod download

      - name: Lint protobuf
        run: buf lint

      - name: Build protobuf
        run: buf build

      - name: Generate protobuf
        run: buf generate

      - name: Check generated code is up to date
        run: git diff --exit-code

      - name: Check formatting
        run: |
          test -z "$(gofmt -l .)"

      - name: Run go vet
        run: go vet ./...

      - name: Run reservation migrations
        run: |
          go run github.com/pressly/goose/v3/cmd/goose@v3.27.0 \
            -dir migrations/reservation \
            postgres \
            "$TEST_POSTGRES_DSN" \
            up

      - name: Run tests
        run: go test ./...

      - name: Build
        run: go build ./...