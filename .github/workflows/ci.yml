name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Check formatting
        run: | 
          test -z "$(gofmt -l .)"
          
      - name: Run go vet
        run: go vet ./...

      - name: Run go tests
        run: go test ./...

      - name: Build
        run: go build ./... 