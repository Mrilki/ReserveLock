name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      TEST_POSTGRES_DSN: postgres://reservelock:reservelock-local@localhost:5432/reservelock_reservation?sslmode=disable
      TEST_MONGO_URI: mongodb://localhost:27017/?replicaSet=rs0&directConnection=true
      TEST_MONGO_DATABASE: reservelock_event_content_test
      TEST_REDIS_URL: redis://localhost:6379/0
      TEST_PAYMENT_POSTGRES_DSN: postgres://reservelock:reservelock-local@localhost:5432/reservelock_payment_test?sslmode=disable
      TEST_ANALYTICS_CLICKHOUSE_DSN: clickhouse://reservelock:reservelock-local@localhost:9000/reservelock_analytics_test

    services:
      postgres:
        image: postgres:17

        env:
          POSTGRES_USER: reservelock
          POSTGRES_PASSWORD: reservelock-local
          POSTGRES_DB: reservelock_reservation

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U reservelock -d reservelock_reservation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:8.2

        ports:
          - 6379:6379

        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      clickhouse:
        image: clickhouse:26.8.15.10

        env:
          CLICKHOUSE_DB: reservelock_analytics_test
          CLICKHOUSE_USER: reservelock
          CLICKHOUSE_PASSWORD: reservelock-local

        ports:
          - 9000:9000

        options: >-
          --ulimit nofile=262144:262144
          --health-cmd "clickhouse-client --user reservelock --password reservelock-local --query 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 20s

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.9'

      - name: Set up Buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Install protobuf Go plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Download dependencies
        run: go mod download

      - name: Lint protobuf
        run: buf lint

      - name: Check protobuf formatting
        run: buf format --diff --exit-code

      - name: Build protobuf
        run: buf build

      - name: Generate protobuf
        run: buf generate

      - name: Check generated code is up to date
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard internal/gen/proto)"

      - name: Check formatting
        run: |
          test -z "$(gofmt -l .)"

      - name: Run go vet
        run: go vet ./...

      - name: Validate Compose configuration
        run: docker compose --env-file .env.example --profile app config --quiet

      - name: Run reservation migrations
        run: |
          go run github.com/pressly/goose/v3/cmd/goose@v3.27.0 \
            -dir migrations/reservation \
            postgres \
            "$TEST_POSTGRES_DSN" \
            up

      - name: Run payment migrations
        run: |
          docker exec "${{ job.services.postgres.id }}" \
            psql -U reservelock -d postgres \
            -c "CREATE DATABASE reservelock_payment_test;"

          go run github.com/pressly/goose/v3/cmd/goose@v3.27.0 \
            -dir migrations/payment \
            postgres \
            "$TEST_PAYMENT_POSTGRES_DSN" \
            up

      - name: Run analytics migrations
        run: |
          go run github.com/pressly/goose/v3/cmd/goose@v3.27.0 \
            -dir migrations/analytics \
            clickhouse \
            "$TEST_ANALYTICS_CLICKHOUSE_DSN" \
            up

      - name: Start MongoDB replica set
        run: |
          docker run -d \
            --name reservelock-mongo \
            -p 27017:27017 \
            mongo:8.0 \
            --replSet rs0 \
            --bind_ip_all

          for i in {1..30}; do
            if docker exec reservelock-mongo \
              mongosh --quiet \
              --eval "db.adminCommand({ ping: 1 }).ok" | grep -q 1; then
              break
            fi

            sleep 1
          done

          docker exec reservelock-mongo \
            mongosh --quiet \
            --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'

          for i in {1..30}; do
            if docker exec reservelock-mongo \
              mongosh --quiet \
              --eval "db.hello().isWritablePrimary" | grep -q true; then
              exit 0
            fi

            sleep 1
          done

          echo "MongoDB replica set did not become primary"
          docker logs reservelock-mongo
          exit 1

      - name: Run tests
        run: go test -race -count=1 -timeout=5m ./...

      - name: Build
        run: go build ./...

  docker:
    name: Docker build (${{ matrix.service }})
    needs: go
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        service:
          - event-content-service
          - reservation-service
          - payment-service
          - analytics-service
          - public-api
          - admin-service
          - migrations

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: docker/${{ matrix.service }}/Dockerfile
          tags: reservelock-${{ matrix.service }}:ci
          push: false
          load: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
