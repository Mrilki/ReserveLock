x-app: &app
  profiles: ["app"]
  restart: unless-stopped
  read_only: true
  tmpfs: ["/tmp"]
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  stop_grace_period: 20s

x-app-health: &app-health
  interval: 5s
  timeout: 3s
  retries: 12
  start_period: 10s

x-migrations: &migrations
  profiles: ["app"]
  image: reservelock-migrations:local
  build:
    context: .
    dockerfile: docker/migrations/Dockerfile
  restart: "no"
  read_only: true
  tmpfs: ["/tmp"]
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]

services:
  mongo:
    image: mongo:8.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports: ["127.0.0.1:27017:27017"]
    volumes: ["mongo_data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "if (db.adminCommand({ping: 1}).ok !== 1) quit(1)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  mongo-init:
    image: mongo:8.0
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint: ["mongosh", "--host", "mongo:27017", "--quiet", "--eval"]
    command:
      - |
        try {
          rs.status();
        } catch (err) {
          rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongo:27017"}]});
        }
        for (let i = 0; i < 300; i++) {
          if (db.hello().isWritablePrimary) quit(0);
          sleep(200);
        }
        throw new Error("MongoDB replica set did not become primary");
    restart: "no"

  postgres:
    image: postgres:17
    ports: ["127.0.0.1:5433:5432"]
    environment:
      POSTGRES_USER: ${RESERVATION_POSTGRES_USER:-reservelock}
      POSTGRES_PASSWORD: ${RESERVATION_POSTGRES_PASSWORD:-reservelock-local}
      POSTGRES_DB: ${RESERVATION_POSTGRES_DB:-reservelock_reservation}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  postgres-init:
    image: postgres:17
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${RESERVATION_POSTGRES_USER:-reservelock}
      PGPASSWORD: ${RESERVATION_POSTGRES_PASSWORD:-reservelock-local}
      PGDATABASE: postgres
      RESERVATION_POSTGRES_DB: ${RESERVATION_POSTGRES_DB:-reservelock_reservation}
      PAYMENT_POSTGRES_DB: ${PAYMENT_POSTGRES_DB:-reservelock_payment}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        psql -v ON_ERROR_STOP=1 \
          --set=reservation_db="$$RESERVATION_POSTGRES_DB" \
          --set=payment_db="$$PAYMENT_POSTGRES_DB" <<'SQL'
        SELECT format('CREATE DATABASE %I', :'reservation_db')
        WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = :'reservation_db')
        \gexec
        SELECT format('CREATE DATABASE %I', :'payment_db')
        WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = :'payment_db')
        \gexec
        SQL
    restart: "no"

  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    ports: ["127.0.0.1:9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-G0_QI_QnTc6LtjRja31qsw}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes: ["kafka_data:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:19092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic reservelock.event-content.event-published.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic reservelock.reservation.lifecycle.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic reservelock.payment.lifecycle.v1 --partitions 3 --replication-factor 1
    restart: "no"

  redis:
    image: redis:8.2
    ports: ["127.0.0.1:6379:6379"]
    command: ["redis-server", "--protected-mode", "no", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse:26.8.15.10
    ports: ["127.0.0.1:8123:8123", "127.0.0.1:9000:9000"]
    environment:
      CLICKHOUSE_DB: ${ANALYTICS_CLICKHOUSE_DB:-reservelock_analytics}
      CLICKHOUSE_USER: ${ANALYTICS_CLICKHOUSE_USER:-reservelock}
      CLICKHOUSE_PASSWORD: ${ANALYTICS_CLICKHOUSE_PASSWORD:-reservelock-local}
    volumes: ["clickhouse_data:/var/lib/clickhouse"]
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$$CLICKHOUSE_USER\" --password \"$$CLICKHOUSE_PASSWORD\" --database \"$$CLICKHOUSE_DB\" --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  reservation-migrate:
    <<: *migrations
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    command: ["-dir", "/migrations/reservation", "postgres", "postgres://${RESERVATION_POSTGRES_USER:-reservelock}:${RESERVATION_POSTGRES_PASSWORD:-reservelock-local}@postgres:5432/${RESERVATION_POSTGRES_DB:-reservelock_reservation}?sslmode=disable", "up"]

  payment-migrate:
    <<: *migrations
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    command: ["-dir", "/migrations/payment", "postgres", "postgres://${RESERVATION_POSTGRES_USER:-reservelock}:${RESERVATION_POSTGRES_PASSWORD:-reservelock-local}@postgres:5432/${PAYMENT_POSTGRES_DB:-reservelock_payment}?sslmode=disable", "up"]

  analytics-migrate:
    <<: *migrations
    depends_on:
      clickhouse:
        condition: service_healthy
    command: ["-dir", "/migrations/analytics", "clickhouse", "clickhouse://${ANALYTICS_CLICKHOUSE_USER:-reservelock}:${ANALYTICS_CLICKHOUSE_PASSWORD:-reservelock-local}@clickhouse:9000/${ANALYTICS_CLICKHOUSE_DB:-reservelock_analytics}", "up"]

  event-content-service:
    <<: *app
    image: reservelock-event-content-service:local
    build:
      context: .
      dockerfile: docker/event-content-service/Dockerfile
    environment:
      APP_ENV: local
      GRPC_ADDR: ":50051"
      EVENT_CONTENT_MONGO_URI: mongodb://mongo:27017/?replicaSet=rs0&directConnection=true
      EVENT_CONTENT_MONGO_DATABASE: reservelock_event_content
      KAFKA_BROKERS: kafka:19092
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      <<: *app-health
      test: ["CMD", "/app/healthcheck", "grpc", "127.0.0.1:50051"]

  reservation-service:
    <<: *app
    image: reservelock-reservation-service:local
    build:
      context: .
      dockerfile: docker/reservation-service/Dockerfile
    environment:
      APP_ENV: local
      GRPC_ADDR: ":50052"
      RESERVATION_POSTGRES_DSN: postgres://${RESERVATION_POSTGRES_USER:-reservelock}:${RESERVATION_POSTGRES_PASSWORD:-reservelock-local}@postgres:5432/${RESERVATION_POSTGRES_DB:-reservelock_reservation}?sslmode=disable
      RESERVATION_REDIS_URL: redis://redis:6379/0
      KAFKA_BROKERS: kafka:19092
    depends_on:
      reservation-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    healthcheck:
      <<: *app-health
      test: ["CMD", "/app/healthcheck", "grpc", "127.0.0.1:50052"]

  payment-service:
    <<: *app
    image: reservelock-payment-service:local
    build:
      context: .
      dockerfile: docker/payment-service/Dockerfile
    environment:
      APP_ENV: local
      GRPC_ADDR: ":50053"
      PAYMENT_POSTGRES_DSN: postgres://${RESERVATION_POSTGRES_USER:-reservelock}:${RESERVATION_POSTGRES_PASSWORD:-reservelock-local}@postgres:5432/${PAYMENT_POSTGRES_DB:-reservelock_payment}?sslmode=disable
      KAFKA_BROKERS: kafka:19092
    depends_on:
      payment-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      <<: *app-health
      test: ["CMD", "/app/healthcheck", "grpc", "127.0.0.1:50053"]

  analytics-service:
    <<: *app
    image: reservelock-analytics-service:local
    build:
      context: .
      dockerfile: docker/analytics-service/Dockerfile
    environment:
      APP_ENV: local
      GRPC_ADDR: ":50054"
      ANALYTICS_CLICKHOUSE_DSN: clickhouse://${ANALYTICS_CLICKHOUSE_USER:-reservelock}:${ANALYTICS_CLICKHOUSE_PASSWORD:-reservelock-local}@clickhouse:9000/${ANALYTICS_CLICKHOUSE_DB:-reservelock_analytics}
      KAFKA_BROKERS: kafka:19092
    depends_on:
      analytics-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      <<: *app-health
      test: ["CMD", "/app/healthcheck", "grpc", "127.0.0.1:50054"]

  public-api:
    <<: *app
    image: reservelock-public-api:local
    build:
      context: .
      dockerfile: docker/public-api/Dockerfile
    environment:
      APP_ENV: local
      HTTP_ADDR: ":8080"
      EVENT_CONTENT_GRPC_ADDR: event-content-service:50051
      RESERVATION_GRPC_ADDR: reservation-service:50052
      PAYMENT_GRPC_ADDR: payment-service:50053
    ports: ["127.0.0.1:${PUBLIC_HTTP_PORT:-8080}:8080"]
    depends_on:
      event-content-service:
        condition: service_healthy
      reservation-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    healthcheck:
      <<: *app-health
      test: ["CMD", "/app/healthcheck", "http", "http://127.0.0.1:8080/health/live"]

  admin-service:
    <<: *app
    image: reservelock-admin-service:local
    build:
      context: .
      dockerfile: docker/admin-service/Dockerfile
    environment:
      APP_ENV: local
      HTTP_ADDR: ":8080"
      GIN_MODE: release
      EVENT_CONTENT_GRPC_ADDR: event-content-service:50051
      ANALYTICS_GRPC_ADDR: analytics-service:50054
    ports: ["127.0.0.1:${ADMIN_HTTP_PORT:-8081}:8080"]
    depends_on:
      event-content-service:
        condition: service_healthy
      analytics-service:
        condition: service_healthy
    healthcheck:
      <<: *app-health
      test: ["CMD", "/app/healthcheck", "http", "http://127.0.0.1:8080/health/live"]

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    profiles: ["tools"]
    depends_on:
      kafka:
        condition: service_healthy
    ports: ["127.0.0.1:8090:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: reservelock-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092

volumes:
  mongo_data:
  postgres_data:
  kafka_data:
  clickhouse_data: