syntax = "proto3";

package reservelock.payment.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/Mrilki/ReserveLock/internal/gen/proto/reservelock/payment/v1;paymentv1";

service PaymentService {
  rpc GetPayment(GetPaymentRequest) returns (GetPaymentResponse);
  rpc SimulatePayment(SimulatePaymentRequest) returns (SimulatePaymentResponse);
}

message GetPaymentRequest {
  string reservation_id = 1;
}

message GetPaymentResponse {
  Payment payment = 1;
}

message SimulatePaymentRequest  {
  string reservation_id = 1;
  PaymentStatus status = 2;
}

message SimulatePaymentResponse {
  Payment payment = 1;
}

message Payment {
  string id = 1;
  string reservation_id = 2;
  string user_id = 3;
  PaymentStatus status = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp expires_at = 6;
}

enum PaymentStatus {
  PAYMENT_STATUS_UNSPECIFIED = 0;
  PAYMENT_STATUS_PENDING = 1;
  PAYMENT_STATUS_SUCCEEDED = 2;
  PAYMENT_STATUS_FAILED = 3;
  PAYMENT_STATUS_CANCELLED = 4;
}