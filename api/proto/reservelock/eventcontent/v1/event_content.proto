syntax = "proto3";

package reservelock.eventcontent.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/Mrilki/ReserveLock/internal/gen/proto/reservelock/eventcontent/v1;eventcontentv1";

service EventContentService {
  rpc CreateVenue(CreateVenueRequest) returns (CreateVenueResponse);
  rpc GetVenue(GetVenueRequest) returns (GetVenueResponse);
  rpc CreateHall(CreateHallRequest) returns (CreateHallResponse);
  rpc GetHall(GetHallRequest) returns (GetHallResponse);
  rpc CreateSeatMap(CreateSeatMapRequest) returns (CreateSeatMapResponse);
  rpc GetSeatMap(GetSeatMapRequest) returns (GetSeatMapResponse);
  rpc CreateEvent(CreateEventRequest) returns (CreateEventResponse);
  rpc GetEvent(GetEventRequest) returns (GetEventResponse);
  rpc PublishEvent(PublishEventRequest) returns (PublishEventResponse);
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse);
}

message CreateVenueRequest {
  string name = 1;
  string city = 2;
  string address = 3;
  string created_by = 4;
}

message CreateVenueResponse {
  Venue venue = 1;
}

message GetVenueRequest {
  string venue_id = 1;
}

message GetVenueResponse {
  Venue venue = 1;
}

message CreateHallRequest {
  string venue_id = 1;
  string name = 2;
  string created_by = 3;
}

message CreateHallResponse {
  Hall hall = 1;
}

message GetHallRequest {
  string hall_id = 1;
}

message GetHallResponse {
  Hall hall = 1;
}

message CreateSeatMapRequest {
  string hall_id = 1;
  string name = 2;
  repeated SeatInput seats = 3;
  string created_by = 4;
}

message CreateSeatMapResponse {
  SeatMap seat_map = 1;
}

message GetSeatMapRequest {
  string seat_map_id = 1;
}

message GetSeatMapResponse {
  SeatMap seat_map = 1;
}

message CreateEventRequest {
  string venue_id = 1;
  string hall_id = 2;
  string seat_map_id = 3;
  string name = 4;
  google.protobuf.Timestamp starts_at = 5;
  string created_by = 6;
}

message CreateEventResponse {
  Event event = 1;
}

message GetEventRequest {
  string event_id = 1;
}

message GetEventResponse {
  Event event = 1;
}

message PublishEventRequest {
  string event_id = 1;
}

message PublishEventResponse {
  Event event = 1;
}

message ListEventsRequest {}

message ListEventsResponse {
  repeated Event events = 1;
}

message Venue {
  string id = 1;
  string name = 2;
  string city = 3;
  string address = 4;
  string created_by = 5;
}

message Hall {
  string id = 1;
  string venue_id = 2;
  string name = 3;
  string created_by = 4;
}

message SeatMap {
  string id = 1;
  string hall_id = 2;
  string name = 3;
  repeated Seat seats = 4;
  string created_by = 5;
}

message Seat {
  string id = 1;
  string section = 2;
  string row = 3;
  string number = 4;
}

message SeatInput {
  string section = 1;
  string row = 2;
  string number = 3;
}

message Event {
  string id = 1;
  string venue_id = 2;
  string hall_id = 3;
  string seat_map_id = 4;
  string name = 5;
  google.protobuf.Timestamp starts_at = 6;
  EventStatus status = 7;
  string created_by = 8;
}

enum EventStatus {
  EVENT_STATUS_UNSPECIFIED = 0;
  EVENT_STATUS_DRAFT = 1;
  EVENT_STATUS_PUBLISHED = 2;
}
