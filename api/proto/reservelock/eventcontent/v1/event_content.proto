syntax = "proto3";

package reservelock.eventcontent.v1;

option go_package = "github.com/Mrilki/ReserveLock/internal/gen/proto/reservelock/eventcontent/v1;eventcontentv1";

service EventContentService {
  rpc CreateVenue(CreateVenueRequest) returns (CreateVenueResponse);
  rpc GetVenue(GetVenueRequest) returns (GetVenueResponse);
  rpc CreateHall(CreateHallRequest) returns (CreateHallResponse);
  rpc GetHall(GetHallRequest) returns (GetHallResponse);
  rpc CreateSeatMap(CreateSeatMapRequest) returns (CreateSeatMapResponse);
  rpc GetSeatMap(GetSeatMapRequest) returns (GetSeatMapResponse);
}


message CreateVenueRequest {
  string name = 1;
  string city = 2;
  string address = 3;
  string created_by = 4;
}

message CreateVenueResponse {
  Venue venue = 1;
}

message GetVenueRequest {
  string venue_id = 1;
}

message GetVenueResponse {
  Venue venue = 1;
}

message CreateHallRequest {
  string venue_id = 1;
  string name = 2;
  string created_by = 3;
}

message CreateHallResponse {
  Hall hall = 1;
}

message GetHallRequest {
  string hall_id = 1;
}

message GetHallResponse {
  Hall hall = 1;
}

message CreateSeatMapRequest {
  string hall_id = 1;
  string name = 2;
  repeated SeatInput seats = 3;
  string created_by = 4;
}

message CreateSeatMapResponse {
  SeatMap seat_map = 1;
}

message GetSeatMapRequest {
  string seat_map_id = 1;
}

message GetSeatMapResponse {
  SeatMap seat_map = 1;
}

message Venue {
  string id = 1;
  string name = 2;
  string city = 3;
  string address = 4;
  string created_by = 5;
}

message Hall {
  string id = 1;
  string venue_id = 2;
  string name = 3;
  string created_by = 4;
}

message SeatMap {
  string id = 1;
  string hall_id = 2;
  string name = 3;
  repeated Seat seats = 4;
  string created_by = 5;
}

message Seat {
  string id = 1;
  string section = 2;
  string row = 3;
  string number = 4;
}

message SeatInput {
  string section = 1;
  string row = 2;
  string number = 3;
}




