syntax = "proto3";

package reservelock.reservation.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/Mrilki/ReserveLock/internal/gen/proto/reservelock/reservation/v1;reservationv1";

service ReservationService {

  rpc CreateReservation(CreateReservationRequest)
      returns (CreateReservationResponse);

  rpc GetReservation(GetReservationRequest)
      returns (GetReservationResponse);

  rpc GetAvailability(GetAvailabilityRequest)
      returns (GetAvailabilityResponse);
}

message CreateReservationRequest {
  string event_id = 1;
  string user_id = 2;
  repeated string seat_ids = 3;
}

message CreateReservationResponse {
  Reservation reservation = 1;
}

message GetReservationRequest {
  string reservation_id = 1;
}

message GetReservationResponse {
  Reservation reservation = 1;
}

message GetAvailabilityRequest {
  string event_id = 1;
}

message GetAvailabilityResponse {
  string event_id = 1;
  repeated SeatAvailability seats = 2;
}

message SeatAvailability {
  string seat_id = 1;
  SeatAvailabilityStatus status = 2;
  google.protobuf.Timestamp held_until = 3;
}

message Reservation {
  string id = 1;
  string event_id = 2;
  string user_id = 3;
  repeated string seat_ids = 4;
  ReservationStatus status = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp expires_at = 7;
}

enum ReservationStatus {
  RESERVATION_STATUS_UNSPECIFIED = 0;
  RESERVATION_STATUS_PENDING = 1;
  RESERVATION_STATUS_CONFIRMED = 2;
  RESERVATION_STATUS_EXPIRED = 3;
}

enum SeatAvailabilityStatus {
  SEAT_AVAILABILITY_STATUS_UNSPECIFIED = 0;
  SEAT_AVAILABILITY_STATUS_AVAILABLE = 1;
  SEAT_AVAILABILITY_STATUS_HELD = 2;
  SEAT_AVAILABILITY_STATUS_RESERVED = 3;
}



